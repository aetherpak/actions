name: "AetherPak Local Setup Wrapper"
description: "Resolve version and run setup-cli."

inputs:
  cli-version:
    description: "aetherpak CLI version to install if missing (ignored if already on PATH)."
    required: false
    default: ""
  install-dependencies:
    description: "Whether to install host dependencies."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Resolve CLI version
      shell: bash
      id: check-cli
      run: |
        # 1. Resolve version to install
        VERSION="${{ inputs.cli-version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${AETHERPAK_CLI_VERSION:-}"
        fi
        if [ -z "$VERSION" ]; then
          if [ -f "${{ github.action_path }}/cli-version.txt" ]; then
            VERSION="$(cat "${{ github.action_path }}/cli-version.txt")"
          elif [ -f "${{ github.action_path }}/../cli-version.txt" ]; then
            VERSION="$(cat "${{ github.action_path }}/../cli-version.txt")"
          else
            VERSION="latest"
          fi
        fi
        VERSION="$(echo "$VERSION" | tr -d '[:space:]')"
        echo "resolved-version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Run setup-cli
      uses: aetherpak/setup-cli@v1
      with:
        version: ${{ steps.check-cli.outputs.resolved-version }}
        install-dependencies: ${{ inputs.install-dependencies }}
