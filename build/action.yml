name: "AetherPak Build/Import"
description: "Compile a Flatpak app from a manifest, or import a pre-built bundle or OSTree repository."

inputs:
  config:
    description: "Path to the aetherpak.yaml config file (provides builder-args, remotes, and resolves manifest when manifest-path is omitted)."
    required: false
    default: ""
  manifest-path:
    description: "Path to the Flatpak manifest (JSON/YAML) within the checked-out sources."
    required: false
    default: ""
  prebuilt-bundle-path:
    description: "Path to a pre-built .flatpak bundle file."
    required: false
    default: ""
  prebuilt-repo-path:
    description: "Path to an existing OSTree repository directory."
    required: false
    default: ""
  app-id:
    description: "Reverse-DNS app id (fallback if not building/resolving from repository)."
    required: false
    default: ""
  branch:
    description: "Flatpak branch (channel). When unset: 'stable' on tag pushes, 'beta' on the default branch, else the git ref name."
    required: false
    default: ""
  arch:
    description: "Target CPU architecture (default: x86_64)."
    required: false
    default: "x86_64"
  run-linter:
    description: "Whether to run flatpak-builder-lint verification (default: true)."
    required: false
    default: "true"
  cache:
    description: "Enable flatpak-builder caching for manifest builds (default: true)."
    required: false
    default: "true"
  repo-path:
    description: "Target path to export or store the OSTree repository."
    required: false
    default: "_repo"
  builder-args:
    description: "Extra flatpak-builder flags for manifest builds, one per line (e.g. --install-deps-from=flathub). Ignored for bundle/repo imports."
    required: false
    default: ""
  upload-bundle:
    description: "Export the built application as a single .flatpak bundle and upload it as a workflow artifact."
    required: false
    default: "false"
  cli-version:
    description: "aetherpak CLI version to install if missing (ignored if already on PATH)."
    required: false
    default: "v0.33.1"
  cache-key:
    description: "Custom cache key prefix for caching build state. When unset, a default prefix including the manifest hash is used."
    required: false
    default: ""
  cache-state:
    description: "Cache flatpak-builder state (downloads and built modules)."
    required: false
    default: "true"
  cache-ccache:
    description: "Cache ccache compiler artifacts."
    required: false
    default: "true"
  cache-build-dir:
    description: "Cache flatpak-builder build directories (requires --keep-build-dirs in builder-args)."
    required: false
    default: "false"

outputs:
  repo-path:
    description: "Path to the OSTree repository containing the application."
    value: ${{ steps.resolve.outputs.repo-path }}
  app-id:
    description: "Resolved Reverse-DNS Application ID."
    value: ${{ steps.resolve.outputs.app-id }}
  branch:
    description: "Resolved Flatpak branch."
    value: ${{ steps.resolve.outputs.branch }}
  arch:
    description: "Resolved application architecture."
    value: ${{ steps.resolve.outputs.arch }}
  ref-type:
    description: "Resolved application ref type (app or runtime)."
    value: ${{ steps.resolve.outputs.ref-type }}
  bundle-path:
    description: "Path to the generated .flatpak bundle (only if upload-bundle is true)."
    value: ${{ steps.bundle.outputs.bundle-path || '' }}
  bundle-artifact-name:
    description: "Name of the uploaded bundle artifact (only if upload-bundle is true)."
    value: ${{ steps.bundle.outputs.artifact-name || '' }}

runs:
  using: "composite"
  steps:
    - name: Validate Inputs
      shell: bash
      run: |
        set -euo pipefail
        SRC_COUNT=0
        if [ -n "${{ inputs.manifest-path }}" ]; then SRC_COUNT=$((SRC_COUNT + 1)); fi
        if [ -n "${{ inputs.prebuilt-bundle-path }}" ]; then SRC_COUNT=$((SRC_COUNT + 1)); fi
        if [ -n "${{ inputs.prebuilt-repo-path }}" ]; then SRC_COUNT=$((SRC_COUNT + 1)); fi

        if [ $SRC_COUNT -gt 1 ]; then
          echo "::error::Conflicting inputs. Provide only ONE of: manifest-path, prebuilt-bundle-path, or prebuilt-repo-path."
          exit 1
        fi

        if [ $SRC_COUNT -eq 0 ]; then
          if [ -z "${{ inputs.config }}" ] || [ -z "${{ inputs.app-id }}" ]; then
            echo "::error::No build source specified. Provide manifest-path, prebuilt-bundle-path, prebuilt-repo-path, or both config and app-id."
            exit 1
          fi
        fi

    - name: Set up aetherpak CLI
      uses: aetherpak/setup-cli@v1
      with:
        version: ${{ inputs.cli-version }}

    - name: Resolve channel
      id: channel
      shell: bash
      env:
        INPUT_BRANCH: ${{ inputs.branch }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_BRANCH" ]; then
          name="$INPUT_BRANCH"
        else
          name="$(aetherpak resolve-channel)"
        fi
        echo "name=${name}" >> "$GITHUB_OUTPUT"

    - name: Determine cache paths
      if: ${{ (inputs.manifest-path != '' || (inputs.config != '' && inputs.prebuilt-bundle-path == '' && inputs.prebuilt-repo-path == '')) && inputs.cache == 'true' && (inputs.cache-state == 'true' || inputs.cache-ccache == 'true' || inputs.cache-build-dir == 'true') }}
      id: cache-paths
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest-path }}
        CONFIG: ${{ inputs.config }}
        APP_ID: ${{ inputs.app-id }}
        CACHE_KEY: ${{ inputs.cache-key }}
        ARCH: ${{ inputs.arch }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # Resolve files to hash for the cache key
        HASH_FILES=()
        if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
          HASH_FILES+=("$MANIFEST")
        fi
        if [ -n "$CONFIG" ] && [ -f "$CONFIG" ]; then
          HASH_FILES+=("$CONFIG")
          # If MANIFEST was not specified, extract the app's manifest path from CONFIG via CLI
          if [ -z "$MANIFEST" ] && [ -n "$APP_ID" ]; then
            RESOLVED_MANIFEST="$(aetherpak config get --config "$CONFIG" "apps.${APP_ID}.manifest" 2>/dev/null || true)"
            if [ -n "$RESOLVED_MANIFEST" ] && [ -f "$RESOLVED_MANIFEST" ]; then
              HASH_FILES+=("$RESOLVED_MANIFEST")
            fi
          fi
        fi

        if [ ${#HASH_FILES[@]} -gt 0 ]; then
          MANIFEST_HASH=$(sha256sum "${HASH_FILES[@]}" | sha256sum | cut -d' ' -f1)
        else
          MANIFEST_HASH="default"
        fi

        PATHS=""
        if [ "${{ inputs.cache-state }}" = "true" ]; then
          PATHS="$PATHS"$'\n'".state/state-*"
        fi
        if [ "${{ inputs.cache-ccache }}" = "true" ]; then
          PATHS="$PATHS"$'\n'".ccache"
        fi
        if [ "${{ inputs.cache-build-dir }}" = "true" ]; then
          PATHS="$PATHS"$'\n'".state/build-*"
        fi
        PATHS="${PATHS#$'\n'}"

        echo "paths<<EOF" >> "$GITHUB_OUTPUT"
        echo "$PATHS" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        # Determine cache key and restore keys
        if [ -n "$CACHE_KEY" ]; then
          if [ -n "$APP_ID" ]; then
            PREFIX="${CACHE_KEY}-${APP_ID}-${ARCH}"
            RESTORE_KEYS="${CACHE_KEY}-${APP_ID}-${ARCH}-"$'\n'"${CACHE_KEY}-${APP_ID}-"$'\n'"${CACHE_KEY}-"
          else
            PREFIX="${CACHE_KEY}-${ARCH}"
            RESTORE_KEYS="${CACHE_KEY}-${ARCH}-"$'\n'"${CACHE_KEY}-"
          fi
        else
          if [ -n "$APP_ID" ]; then
            PREFIX="aetherpak-flatpak-${APP_ID}-${ARCH}-${MANIFEST_HASH}"
            RESTORE_KEYS="aetherpak-flatpak-${APP_ID}-${ARCH}-${MANIFEST_HASH}-"$'\n'"aetherpak-flatpak-${APP_ID}-${ARCH}-"$'\n'"aetherpak-flatpak-${APP_ID}-"
          else
            PREFIX="aetherpak-flatpak-${ARCH}-${MANIFEST_HASH}"
            RESTORE_KEYS="aetherpak-flatpak-${ARCH}-${MANIFEST_HASH}-"$'\n'"aetherpak-flatpak-${ARCH}-"
          fi
        fi

        echo "key=${PREFIX}-${SHA}" >> "$GITHUB_OUTPUT"
        echo "restore-keys<<EOF" >> "$GITHUB_OUTPUT"
        echo "$RESTORE_KEYS" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Cache build state
      if: ${{ (inputs.manifest-path != '' || (inputs.config != '' && inputs.prebuilt-bundle-path == '' && inputs.prebuilt-repo-path == '')) && inputs.cache == 'true' && (inputs.cache-state == 'true' || inputs.cache-ccache == 'true' || inputs.cache-build-dir == 'true') }}
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache-paths.outputs.paths }}
        key: ${{ steps.cache-paths.outputs.key }}
        restore-keys: ${{ steps.cache-paths.outputs.restore-keys }}

    - name: Build from manifest
      if: ${{ inputs.manifest-path != '' || (inputs.config != '' && inputs.prebuilt-bundle-path == '' && inputs.prebuilt-repo-path == '') }}
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        APP_ID: ${{ inputs.app-id }}
        MANIFEST: ${{ inputs.manifest-path }}
        ARCH: ${{ inputs.arch }}
        BRANCH: ${{ steps.channel.outputs.name }}
        REPO: ${{ inputs.repo-path }}
        RUN_LINTER: ${{ inputs.run-linter }}
        BUILDER_ARGS: ${{ inputs.builder-args }}
      run: |
        set -euo pipefail
        ARGS=(--arch "$ARCH" --branch "$BRANCH" --repo-path "$REPO")
        [ -n "$CONFIG" ] && ARGS+=(--config "$CONFIG")
        [ -n "$MANIFEST" ] && ARGS+=(--manifest "$MANIFEST")
        [ -n "$APP_ID" ] && ARGS+=(--app-id "$APP_ID")
        [ "$RUN_LINTER" = "true" ] && ARGS+=(--run-linter)
        while IFS= read -r arg; do
          [ -n "$arg" ] && ARGS+=(--builder-arg "$arg")
        done <<< "$BUILDER_ARGS"
        aetherpak build "${ARGS[@]}"

    - name: Import pre-built bundle
      if: ${{ inputs.prebuilt-bundle-path != '' }}
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        BUNDLE: ${{ inputs.prebuilt-bundle-path }}
        ARCH: ${{ inputs.arch }}
        BRANCH: ${{ steps.channel.outputs.name }}
        REPO: ${{ inputs.repo-path }}
        APP: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        ARGS=()
        [ -n "$CONFIG" ] && ARGS+=(--config "$CONFIG")
        if [ -n "$BUNDLE" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            IFS=',' read -r -a subpaths <<< "$line"
            for p in "${subpaths[@]}"; do
              p=$(echo "$p" | xargs)
              [ -n "$p" ] && ARGS+=(--bundle-path "$p")
            done
          done <<< "$BUNDLE"
        fi
        [ -n "$ARCH" ] && ARGS+=(--arch "$ARCH")
        [ -n "$BRANCH" ] && ARGS+=(--branch "$BRANCH")
        [ -n "$REPO" ] && ARGS+=(--repo-path "$REPO")
        [ -n "$APP" ] && ARGS+=(--app-id "$APP")
        aetherpak import "${ARGS[@]}"


    - name: Copy pre-built OSTree repository
      if: ${{ inputs.prebuilt-repo-path != '' }}
      shell: bash
      env:
        SRC: ${{ inputs.prebuilt-repo-path }}
        DST: ${{ inputs.repo-path }}
      run: |
        set -euo pipefail
        if [ "$SRC" != "$DST" ]; then
          mkdir -p "$DST"
          cp -al "$SRC"/. "$DST"/
        fi

    - name: Resolve app info
      id: resolve
      shell: bash
      env:
        REPO: ${{ inputs.repo-path }}
      run: |
        set -euo pipefail
        aetherpak inspect-repo --repo-path "$REPO" --output-file "$GITHUB_OUTPUT"

    # Manifest builds lint via `aetherpak build --run-linter`; imports have no
    # manifest, so lint the resulting repo here.
    - name: Lint imported repository
      if: ${{ inputs.run-linter == 'true' && (inputs.prebuilt-bundle-path != '' || inputs.prebuilt-repo-path != '') }}
      shell: bash
      env:
        REPO: ${{ inputs.repo-path }}
      run: |
        set -euo pipefail
        flatpak-builder-lint repo "$REPO"

    - name: Export flatpak bundle
      if: ${{ (inputs.manifest-path != '' || (inputs.config != '' && inputs.prebuilt-bundle-path == '' && inputs.prebuilt-repo-path == '')) && (inputs.upload-bundle == 'true' || inputs.upload-bundle == true) }}
      id: bundle
      shell: bash
      env:
        REPO: ${{ inputs.repo-path }}
        APP_ID: ${{ steps.resolve.outputs.app-id }}
        BRANCH: ${{ steps.resolve.outputs.branch }}
        ARCH: ${{ steps.resolve.outputs.arch }}
        REF_TYPE: ${{ steps.resolve.outputs.ref-type }}
      run: |
        set -euo pipefail
        BUNDLE_NAME="${APP_ID}_${ARCH}.flatpak"
        ARGS=()
        [ "$REF_TYPE" = "runtime" ] && ARGS+=(--runtime)
        flatpak build-bundle "${ARGS[@]}" "$REPO" "$BUNDLE_NAME" "$APP_ID" "$BRANCH"
        ARTIFACT_NAME="flatpak-bundle-${APP_ID}-${ARCH}"
        echo "bundle-path=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"
        echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

    - name: Upload bundle artifact
      if: ${{ (inputs.manifest-path != '' || (inputs.config != '' && inputs.prebuilt-bundle-path == '' && inputs.prebuilt-repo-path == '')) && (inputs.upload-bundle == 'true' || inputs.upload-bundle == true) }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.bundle.outputs.artifact-name }}
        path: ${{ steps.bundle.outputs.bundle-path }}
