name: "AetherPak Prep Bundle"
description: "Fetch a .flatpak bundle, verify SHA-256, import into an OSTree repo, and rebind the commit to the consumer-declared channel."

inputs:
  url:
    description: "URL to fetch the bundle from."
    required: false
  sha256:
    description: "Expected SHA-256 of the downloaded bundle."
    required: false
  branch:
    description: "Target channel; the imported app/* ref is rebound to this branch (xa.ref binding rewritten)."
    required: false
    default: "stable"
  repo-path:
    description: "OSTree repo path to write into."
    required: false
    default: "_repo"
  bundle-path:
    description: "Path to a local prebuilt .flatpak bundle file or target filename."
    required: false
    default: ""
  cli-version:
    description: "aetherpak CLI version to install if missing (ignored if already on PATH)."
    required: false
    default: "v0.24.0"

runs:
  using: "composite"
  steps:
    - name: Set up aetherpak CLI
      uses: aetherpak/setup-cli@v1
      with:
        version: ${{ inputs.cli-version }}

    - name: Fetch, verify, import, and rebind
      shell: bash
      env:
        URL: ${{ inputs.url }}
        SHA: ${{ inputs.sha256 }}
        BRANCH: ${{ inputs.branch }}
        REPO: ${{ inputs.repo-path }}
        BUNDLE_PATH: ${{ inputs.bundle-path }}
      run: |
        set -euo pipefail
        if [ -z "$URL" ] && [ -z "$BUNDLE_PATH" ]; then
          echo "::error::Either url or bundle-path must be specified."
          exit 1
        fi
        ARGS=()
        if [ -n "$URL" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            IFS=',' read -r -a suburls <<< "$line"
            for u in "${suburls[@]}"; do
              u=$(echo "$u" | xargs)
              [ -n "$u" ] && ARGS+=(--bundle-url "$u")
            done
          done <<< "$URL"
        fi
        [ -n "$SHA" ] && ARGS+=(--bundle-sha256 "$SHA")
        if [ -n "$BUNDLE_PATH" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            IFS=',' read -r -a subpaths <<< "$line"
            for p in "${subpaths[@]}"; do
              p=$(echo "$p" | xargs)
              [ -n "$p" ] && ARGS+=(--bundle-path "$p")
            done
          done <<< "$BUNDLE_PATH"
        fi
        [ -n "$BRANCH" ] && ARGS+=(--branch "$BRANCH")
        [ -n "$REPO" ] && ARGS+=(--repo-path "$REPO")
        aetherpak import "${ARGS[@]}"
