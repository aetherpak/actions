name: Bump CLI Version

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Check & Bump aetherpak CLI version
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AETHERPAK_ACTION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AETHERPAK_ACTION_BOT_APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: |
          set -euo pipefail
          USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "user-id=$USER_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get Latest CLI Version
        id: get-version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          LATEST_VER=$(gh release view --repo aetherpak/cli --json tagName -q .tagName)
          echo "latest=$LATEST_VER" >> "$GITHUB_OUTPUT"

      - name: Get Current CLI Version
        id: current-version
        run: |
          set -euo pipefail
          CURRENT_VER=$(tr -d '[:space:]' < cli-version.txt)
          echo "current=$CURRENT_VER" >> "$GITHUB_OUTPUT"

      - name: Update version references
        if: steps.get-version.outputs.latest != steps.current-version.outputs.current
        run: |
          set -euo pipefail
          chmod +x scripts/update-version.sh
          ./scripts/update-version.sh "${{ steps.get-version.outputs.latest }}"

      - name: Create Pull Request
        if: steps.get-version.outputs.latest != steps.current-version.outputs.current
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(deps): bump aetherpak cli version to ${{ steps.get-version.outputs.latest }}"
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          signoff: false
          branch: bump-cli-version
          delete-branch: true
          title: "chore(deps): bump aetherpak cli version to ${{ steps.get-version.outputs.latest }}"
          body: |
            Bumps the default pinned version of the `aetherpak` CLI to `${{ steps.get-version.outputs.latest }}` across all composite actions, workflows, and documentation.

            Automatically generated by the Bump CLI Version workflow.
          labels: |
            dependencies
            automated pr
