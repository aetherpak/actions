name: Build & Publish Flatpak Repository
on:
  workflow_call:
    inputs:
      # --- Manifest mode (single app) ---
      manifest-path:
        description: "Path to a single Flatpak manifest. Selects manifest mode. Mutually exclusive with config."
        required: false
        type: string
        default: ""
      arches:
        description: "Manifest mode: space-separated subset of x86_64 aarch64."
        required: false
        type: string
        default: "x86_64 aarch64"
      branch:
        description: "Manifest mode: Flatpak branch (channel). Default stable."
        required: false
        type: string
        default: ""
      run-linter:
        description: "Manifest mode: run flatpak-builder-lint on the build."
        required: false
        type: boolean
        default: true
      cache:
        description: "Manifest mode: cache flatpak runtimes and builder state."
        required: false
        type: boolean
        default: true
      cache-key:
        description: "Custom cache key prefix for caching build state."
        required: false
        type: string
        default: ""
      cache-state:
        description: "Cache flatpak-builder state (downloads and built modules)."
        required: false
        type: boolean
        default: true
      cache-ccache:
        description: "Cache ccache compiler artifacts."
        required: false
        type: boolean
        default: true
      cache-build-dir:
        description: "Cache flatpak-builder build directories (requires --keep-build-dirs)."
        required: false
        type: boolean
        default: false
      # --- Config mode (one or more apps) ---
      config:
        description: "Path to aetherpak.yaml. Used when manifest-path is empty; defaults to aetherpak.yaml auto-detection."
        required: false
        type: string
        default: ""
      app:
        description: "Config mode: rebuild only this app id (blank = change detection)."
        required: false
        type: string
        default: ""
      force-all:
        description: "Config mode: rebuild every app in the config."
        required: false
        type: boolean
        default: false
      base-sha:
        description: "Config mode: commit to diff against for change detection. Defaults to github.event.before."
        required: false
        type: string
        default: ""
      workflow-path:
        description: "Config mode: caller workflow path; touching it triggers a rebuild-all."
        required: false
        type: string
        default: ""
      # --- Shared ---
      reconcile-only:
        description: "Skip build/publish-oci; only reconcile the index against the registry and re-deploy."
        required: false
        type: boolean
        default: false
      registry:
        required: false
        type: string
        default: "ghcr.io"
      oci-repository:
        description: "OCI repository path. Defaults to the GitHub repository."
        required: false
        type: string
        default: ""
      remote-name:
        description: "Flatpak remote name and .flatpakrepo filename."
        required: false
        type: string
        default: ""
      pages-url:
        description: "Public URL. Defaults to the project's Pages URL."
        required: false
        type: string
        default: ""
      landing-page:
        required: false
        type: boolean
        default: true
      deploy:
        description: "Deploy to GitHub Pages. Set false to upload _site as a plain artifact."
        required: false
        type: boolean
        default: true
      artifact-name:
        description: "Name of the uploaded site artifact when deploy is false."
        required: false
        type: string
        default: "aetherpak-site"
      signing:
        required: false
        type: string
        default: "auto"
      runtime-repo:
        required: false
        type: string
        default: "https://dl.flathub.org/repo/flathub.flatpakrepo"
      index-template:
        description: "Path to a custom HTML index template. Empty defers to aetherpak.yaml's branding.index_template."
        required: false
        type: string
        default: ""
      submodules:
        description: "Submodule fetch mode for the build checkout."
        required: false
        type: string
        default: "recursive"
      concurrency-group:
        required: false
        type: string
        default: ""
      site-subpath:
        description: "Optional subdirectory under site-dir to structure the repository files."
        required: false
        type: string
        default: ""
      cli-version:
        description: "aetherpak CLI release tag to install (e.g. v0.11.2), or 'latest'."
        required: false
        type: string
        default: "v0.17.3"
      builder-args:
        description: "Extra flatpak-builder flags applied to every manifest build, one per line."
        required: false
        type: string
        default: "--install-deps-from=flathub"
      upload-bundle:
        description: "Export the built application as a single .flatpak bundle and upload it as a workflow artifact."
        required: false
        type: boolean
        default: false
      prebuilt-bundle-artifact:
        description: "Name or pattern of prebuilt bundle workflow artifacts to download and ingest. Supports {arch}, {electron-arch}, {app-id}, and {branch} placeholders."
        required: false
        type: string
        default: ""
      dry-run:
        description: "Dry run mode. Build and verify everything, but skip pushing to the registry and publishing the site."
        required: false
        type: boolean
        default: false
    outputs:
      pages-url:
        value: ${{ jobs.plan.outputs.pages-url }}
    secrets:
      gpg-private-key:
        required: false
      gpg-private-key-passphrase:
        required: false
      registry-token:
        description: "Registry auth token for skopeo login. Defaults to the GitHub token (GHCR)."
        required: false

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/aetherpak/cli:${{ inputs.cli-version }}
    outputs:
      matrix:                  ${{ steps.p.outputs.matrix }}
      matrix-manifest:         ${{ steps.p.outputs.matrix-manifest }}
      matrix-bundle:           ${{ steps.p.outputs.matrix-bundle }}
      count:                   ${{ steps.p.outputs.count }}
      count-manifest:          ${{ steps.p.outputs.count-manifest }}
      count-bundle:            ${{ steps.p.outputs.count-bundle }}
      pages-url:               ${{ steps.u.outputs.pages-url }}
      actions-ref:             ${{ steps.aref.outputs.ref }}
    steps:
      - name: Validate mode
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          if [ -n "$MANIFEST_PATH" ] && [ -n "$CONFIG" ]; then
            echo "::error::Provide either manifest-path (single-app) or config (multi-app), not both."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Config mode only diffs gitlink trees, so contents aren't needed.
          # Manifest mode reads a manifest that may live in a submodule.
          submodules: ${{ inputs.manifest-path != '' && inputs.submodules || false }}
      - name: Resolve Pages URL
        id: u
        env:
          PAGES_URL: ${{ inputs.pages-url }}
          DEFAULT_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          url="$PAGES_URL"; [ -n "$url" ] || url="$DEFAULT_PAGES_URL"
          echo "pages-url=$url" >> "$GITHUB_OUTPUT"
      - name: Resolve actions ref
        id: aref
        env:
          JWR: ${{ github.job_workflow_ref }}
        run: |
          set -euo pipefail
          ref="${JWR##*@}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - name: Check out actions repo
        uses: actions/checkout@v6
        with:
          repository: aetherpak/actions
          ref: ${{ steps.aref.outputs.ref }}
          path: .github/actions/aetherpak
      - name: Plan
        id: p
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          ARCHES: ${{ inputs.arches }}
          BRANCH: ${{ inputs.branch }}
          RUN_LINTER: ${{ inputs.run-linter }}
          CONFIG: ${{ inputs.config }}
          APP: ${{ inputs.app }}
          FORCE_ALL: ${{ github.event_name == 'schedule' || inputs.force-all }}
          BASE_SHA: ${{ inputs.base-sha != '' && inputs.base-sha || github.event.before }}
          WORKFLOW_PATH: ${{ inputs.workflow-path }}
        run: |
          set -euo pipefail
          if [ -n "$MANIFEST_PATH" ]; then
            ARGS=(--manifest "$MANIFEST_PATH")
            [ "$RUN_LINTER" != "true" ] && ARGS+=(--disable-linter)
            [ -n "$BRANCH" ] && ARGS+=(--branch "$BRANCH")
            for a in $ARCHES; do ARGS+=(--arch "$a"); done
            aetherpak plan "${ARGS[@]}" --output-file "$GITHUB_OUTPUT"
          else
            ARGS=()
            [ -n "$CONFIG" ] && ARGS+=(--config "$CONFIG")
            if [ "$FORCE_ALL" = "true" ]; then
              ARGS+=(--force all)
            elif [ -n "$APP" ]; then
              ARGS+=(--force "$APP")
            fi
            [ -n "$BASE_SHA" ] && ARGS+=(--base-sha "$BASE_SHA")
            [ -n "$WORKFLOW_PATH" ] && ARGS+=(--workflow-path "$WORKFLOW_PATH")
            aetherpak plan "${ARGS[@]}" --output-file "$GITHUB_OUTPUT"
          fi

  build-manifest:
    name: "Build ${{ matrix.app-id }} (${{ matrix.arch }})"
    needs: plan
    if: ${{ !inputs.reconcile-only && needs.plan.outputs.count-manifest != '0' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix-manifest) }}
    permissions:
      contents: read
    container:
      # Builds run as root here, so flatpak-builder's default --system install
      # writes the runtime directly without the polkit/dbus system helper.
      image: ghcr.io/aetherpak/cli:${{ inputs.cli-version }}-builder
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
      - name: Check out actions repo
        uses: actions/checkout@v6
        with:
          repository: aetherpak/actions
          ref: ${{ needs.plan.outputs.actions-ref }}
          path: .github/actions/aetherpak
      - name: Build
        uses: ./.github/actions/aetherpak/build
        with:
          app-id:        ${{ matrix.app-id }}
          manifest-path: ${{ matrix.manifest }}
          arch:          ${{ matrix.arch }}
          branch:        ${{ matrix.branch }}
          repo-path:     _repo
          run-linter:    ${{ matrix.run-linter }}
          cache:         ${{ inputs.cache }}
          cache-key:     ${{ inputs.cache-key }}
          cache-state:   ${{ inputs.cache-state }}
          cache-ccache:  ${{ inputs.cache-ccache }}
          cache-build-dir: ${{ inputs.cache-build-dir }}
          builder-args:  ${{ inputs.builder-args }}
          upload-bundle: ${{ inputs.upload-bundle }}
      - name: Upload OSTree repo
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo
          retention-days: 1

  prep-bundle:
    name: "Fetch ${{ matrix.app-id }} (${{ matrix.arch }})"
    needs: plan
    if: ${{ !inputs.reconcile-only && needs.plan.outputs.count-bundle != '0' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix-bundle) }}
    permissions:
      contents: read
    container:
      image: ghcr.io/aetherpak/cli:${{ inputs.cli-version }}-builder
    steps:
      - name: Check out actions repo
        uses: actions/checkout@v6
        with:
          repository: aetherpak/actions
          ref: ${{ needs.plan.outputs.actions-ref }}
          path: .github/actions/aetherpak

      - name: Resolve prebuilt bundle artifact name
        id: resolve-artifact
        if: ${{ inputs.prebuilt-bundle-artifact != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="${{ inputs.prebuilt-bundle-artifact }}"
          ARTIFACT_NAME="${ARTIFACT_NAME//\{arch\}/${{ matrix.arch }}}"
          ARTIFACT_NAME="${ARTIFACT_NAME//\{app-id\}/${{ matrix.app-id }}}"
          ARTIFACT_NAME="${ARTIFACT_NAME//\{branch\}/${{ matrix.branch }}}"
          echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download prebuilt bundle artifact
        if: ${{ inputs.prebuilt-bundle-artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.resolve-artifact.outputs.artifact-name }}
          path: _downloaded_bundle

      - name: Find prebuilt bundle file
        id: find-bundle
        if: ${{ inputs.prebuilt-bundle-artifact != '' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          target_suffix="${{ matrix.app-id }}/${{ matrix.arch }}/${{ matrix.branch }}"
          target_prefix_suffix="${{ matrix.app-id }}/${{ matrix.arch }}/"

          matched_file=""
          for f in _downloaded_bundle/**/*.flatpak; do
            ref=$(flatpak info --show-ref "$f" 2>/dev/null || true)
            if [ "$ref" = "app/$target_suffix" ] || [ "$ref" = "runtime/$target_suffix" ]; then
              matched_file="$f"
              break
            fi
          done

          if [ -z "$matched_file" ]; then
            for f in _downloaded_bundle/**/*.flatpak; do
              ref=$(flatpak info --show-ref "$f" 2>/dev/null || true)
              if [[ "$ref" == "app/$target_prefix_suffix"* ]] || [[ "$ref" == "runtime/$target_prefix_suffix"* ]]; then
                matched_file="$f"
                break
              fi
            done
          fi

          if [ -z "$matched_file" ]; then
            files=( _downloaded_bundle/**/*.flatpak )
            if [ ${#files[@]} -eq 1 ]; then
              matched_file="${files[0]}"
            elif [ ${#files[@]} -gt 1 ]; then
              echo "::error::Multiple .flatpak bundles found, but none match app-id '${{ matrix.app-id }}' and arch '${{ matrix.arch }}'."
              exit 1
            else
              echo "::error::No .flatpak bundle found in downloaded artifact."
              exit 1
            fi
          fi
          echo "bundle-path=$matched_file" >> "$GITHUB_OUTPUT"


      - name: Fetch + import + rebind
        uses: ./.github/actions/aetherpak/prep-bundle
        with:
          url:         ${{ inputs.prebuilt-bundle-artifact == '' && matrix.bundle-url || '' }}
          sha256:      ${{ inputs.prebuilt-bundle-artifact == '' && matrix.bundle-sha256 || '' }}
          bundle-path: ${{ inputs.prebuilt-bundle-artifact != '' && steps.find-bundle.outputs.bundle-path || '' }}
          branch:      ${{ matrix.branch }}
          repo-path:   _repo

      - name: Upload OSTree repo
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo
          retention-days: 1

  publish-oci:
    name: "Publish ${{ matrix.app-id }} (${{ matrix.arch }})"
    needs: [plan, build-manifest, prep-bundle]
    if: ${{ !cancelled() && !failure() && !inputs.reconcile-only && !inputs.dry-run && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: ghcr.io/aetherpak/cli:${{ inputs.cli-version }}-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check out actions repo
        uses: actions/checkout@v6
        with:
          repository: aetherpak/actions
          ref: ${{ needs.plan.outputs.actions-ref }}
          path: .github/actions/aetherpak
      - name: Download OSTree repo
        uses: actions/download-artifact@v8
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _repo
      - name: Push
        uses: ./.github/actions/aetherpak/publish-oci
        with:
          repo-path: _repo
          app-id: ${{ matrix.app-id }}
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.branch }}
          registry: ${{ inputs.registry }}
          oci-repository: ${{ inputs.oci-repository }}
          registry-token: ${{ secrets.registry-token || github.token }}
          signing: ${{ inputs.signing }}
          gpg-private-key: ${{ secrets.gpg-private-key }}
          gpg-private-key-passphrase: ${{ secrets.gpg-private-key-passphrase }}
          records-dir: _records
      - name: Upload record
        uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-${{ matrix.app-id }}-${{ matrix.arch }}
          path: _records
          include-hidden-files: true
          retention-days: 1

  publish-site:
    name: Publish site & deploy
    needs: [plan, publish-oci]
    if: ${{ !cancelled() && !failure() && !inputs.dry-run && (inputs.reconcile-only || needs.plan.outputs.count != '0') }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.concurrency-group != '' && inputs.concurrency-group || format('aetherpak-publish-{0}', github.repository) }}
      cancel-in-progress: false
    container:
      image: ghcr.io/aetherpak/cli:${{ inputs.cli-version }}
    environment:
      name: ${{ inputs.deploy && 'github-pages' || '' }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check out actions repo
        uses: actions/checkout@v6
        with:
          repository: aetherpak/actions
          ref: ${{ needs.plan.outputs.actions-ref }}
          path: .github/actions/aetherpak
      - name: Download records
        if: ${{ !inputs.reconcile-only }}
        uses: actions/download-artifact@v8
        with:
          pattern: aetherpak-record-*
          path: _records_in
      - name: Flatten records
        # nullglob keeps reconcile-only runs (empty / missing _records_in) sound.
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _records
          for dir in _records_in/*/; do cp -r "$dir." _records/; done
      - name: Build site
        uses: ./.github/actions/aetherpak/publish-site
        with:
          records-dir: _records
          pages-url:    ${{ needs.plan.outputs.pages-url }}
          remote-name:  ${{ inputs.remote-name }}
          landing-page: ${{ inputs.landing-page }}
          signing:      ${{ inputs.signing }}
          runtime-repo: ${{ inputs.runtime-repo }}
          index-template: ${{ inputs.index-template }}
          gpg-private-key:            ${{ secrets.gpg-private-key }}
          gpg-private-key-passphrase: ${{ secrets.gpg-private-key-passphrase }}
          upload-pages-artifact: ${{ inputs.deploy }}
          site-subpath: ${{ inputs.site-subpath }}
      - name: Deploy
        id: deploy
        if: ${{ inputs.deploy }}
        uses: actions/deploy-pages@v5
      - name: Upload site artifact
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: _site
